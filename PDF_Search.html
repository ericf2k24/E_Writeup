<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Search by E</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <style>
        :root { --primary: #e2e8f0; --secondary: #7c3aed; --bg: #f8fafc; --text: #1e293b; }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); max-width: 800px; margin: 20px auto; padding: 0 20px; }
        .card { background: white; padding: 0.75rem; border-radius: 6px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; }
        
        .grid { display: flex; flex-direction: row; gap: 1rem; margin-bottom: 5px; align-items: flex-end; }
        .input-box { width: 200px; display: flex; flex-direction: column; gap: 0.2rem; flex-shrink: 0; margin-bottom: 0px; }
        .input-box.wide { width: 414px; }
        label { font-size: 0.75rem; font-weight: 700; color: black; text-transform: uppercase; margin-top: 0px; }
        
        input { padding: 0.25rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.85rem; }
        input:focus { outline: 2px solid var(--primary); border-color: transparent; }
        
        textarea { padding: 0.25rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.85rem; font-family: inherit; resize: vertical; }
        textarea:focus { outline: 2px solid var(--primary); border-color: transparent; }

        .btn-row { width: 414px; display:flex ; flex-direction: row; gap: 1rem;  }
        button {  flex: 1; padding: 0.25rem; border-radius: 6px; font-weight: 600; cursor: pointer; border: none; transition: 0.2s; }
        
        #searchBtn { background: var(--primary); color: black; }
        #searchBtn:hover { background: #8f9093; }
        #clearBtn { background: #e2e8f0; color: black; }
        #clearBtn:hover { background: #8f9093; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .status-bar {  width: 395px; margin: 5px 0; padding: 0.5rem; border-radius: 6px; background: #f1f5f9; font-size: 0.85rem; border-left: 4px solid var(--primary); display: flex; justify-content: space-between; }
        
        .result-card { background: white; border: 1px solid #e2e8f0; margin-bottom: 1rem; border-radius: 8px; animation: fadeIn 0.3s ease; }
        .result-header { background: #e2e8f0; padding: 0.75rem 1rem; display: flex; justify-content: space-between; border-bottom: 1px solid #e2e8f0; font-size: 0.85rem; }
        .file-link { color: black; text-decoration: none; font-weight: 600; }
        .snippet { padding: 1.25rem; font-family: 'Fira Code', monospace; font-size: 0.9rem; line-height: 1.6; white-space: pre-wrap; color: black; }
        
        /* Highlights */
        .hl-primary { background: #fde047; color: #000; padding: 2px 4px; border-radius: 3px; font-weight: bold; }
        .hl-secondary { background: #c4b5fd; color: #2e1065; padding: 2px 4px; border-radius: 3px; font-weight: bold; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="card">
    <h2 style="font-size: 1.00rem; margin-top: 0; margin-bottom: 10px; color: black;">PDF Search</h2>
    
    <div class="grid">
        <div class="input-box">
            <label>Primary Word</label>
            <input type="text" id="keyword" placeholder="Find this first...">
        </div>
        <div class="input-box">
            <label>Secondary Word (Optional)</label>
            <input type="text" id="filter" placeholder="Must be near primary word...">
        </div>
    </div>
    <div class="grid">
        <div class="input-box">
            <label>Chars Before</label>
            <input type="number" id="pre" value="100">
        </div>
        <div class="input-box">
            <label>Chars After</label>
            <input type="number" id="post" value="100">
        </div>
    </div>
    <div class="grid">
        <div class="input-box wide">
            <label>File Names to include (leave blank for all Congresses)</label>
            <textarea id="fileFilter" rows="1" style="width: 190px; resize: none;" placeholder="181; 192; 201"></textarea>
        </div>
    </div>
    
    <div class="btn-row">
        <button id="searchBtn">Select Folder & Search</button>
        <button id="clearBtn">Clear</button>
    </div>

    <div id="status" class="status-bar">
        <span>Ready.</span>
        <span id="counter">Matches: 0</span>
    </div>
    <div id="results"></div>
</div>

<script>
    //pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

    const searchBtn = document.getElementById('searchBtn');
    const resultsDiv = document.getElementById('results');
    const statusText = document.querySelector('#status span');
    const counterText = document.getElementById('counter');

    let fileMap = new Map();

    const fallbackInput = document.createElement('input');
    fallbackInput.type = 'file';
    fallbackInput.multiple = true;
    fallbackInput.webkitdirectory = true;
    fallbackInput.accept = '.pdf';
    fallbackInput.style.display = 'none';
    document.body.appendChild(fallbackInput);

    searchBtn.addEventListener('click', async () => {
        const kw1 = document.getElementById('keyword').value.trim();
        const kw2 = document.getElementById('filter').value.trim();
        
        if (!kw1) return alert("Please enter a primary search term.");

        fileMap.clear();

        if ('showDirectoryPicker' in window && !/Android|iPhone|iPad/i.test(navigator.userAgent)) {
            try {
                const dirHandle = await window.showDirectoryPicker();
                resultsDiv.innerHTML = '';
                searchBtn.disabled = true;
                await processDirectoryHandle(dirHandle, kw1, kw2);
            } catch (err) {
                console.error(err);
                statusText.innerText = "Error or User Cancelled.";
                searchBtn.disabled = false;
            }
        } else {
            statusText.innerText = "Please select PDF files...";
            fallbackInput.value = ''; 
            fallbackInput.click();
        }
    });

    fallbackInput.addEventListener('change', async (e) => {
        const kw1 = document.getElementById('keyword').value.trim();
        const kw2 = document.getElementById('filter').value.trim();
        
        const allFiles = Array.from(e.target.files);
        const pdfFiles = allFiles.filter(file => file.name.toLowerCase().endsWith('.pdf'));
        
        if (pdfFiles.length === 0) {
            statusText.innerText = "No PDF files found in selected folder.";
            return;
        }

        resultsDiv.innerHTML = '';
        searchBtn.disabled = true;
        await processStandardFiles(pdfFiles, kw1, kw2);
    });

    async function processDirectoryHandle(dirHandle, kw1, kw2) {
        let matchCount = 0;
        const config = getSearchConfig();

        try {
            const entries = [];
            for await (const entry of dirHandle.values()) {
                if (entry.kind === 'file' && entry.name.toLowerCase().endsWith('.pdf')) {
                    entries.push(entry);
                }
            }

            entries.sort((a, b) => b.name.localeCompare(a.name, undefined, { numeric: true, sensitivity: 'base' }));

            for (const entry of entries) {
                if (!isFileAllowed(entry.name, config.fileFilters)) continue;

                statusText.innerText = `Analyzing: ${entry.name}...`;
                const file = await entry.getFile();
                
                const fileId = 'file_' + Math.random().toString(36).substr(2, 9);
                fileMap.set(fileId, file);

                matchCount = await scanPdf(file, entry.name, fileId, kw1, kw2, config, matchCount);
            }
            statusText.innerText = `Search Complete.`;
        } catch (err) {
            console.error(err);
            statusText.innerText = "An error occurred during processing.";
        } finally {
            searchBtn.disabled = false;
        }
    }

    async function processStandardFiles(files, kw1, kw2) {
        let matchCount = 0;
        const config = getSearchConfig();

        try {
            const sortedFiles = [...files].sort((a, b) => b.name.localeCompare(a.name, undefined, { numeric: true, sensitivity: 'base' }));

            for (const file of sortedFiles) {
                if (!isFileAllowed(file.name, config.fileFilters)) continue;

                statusText.innerText = `Analyzing: ${file.name}...`;
                
                const fileId = 'file_' + Math.random().toString(36).substr(2, 9);
                fileMap.set(fileId, file);

                matchCount = await scanPdf(file, file.name, fileId, kw1, kw2, config, matchCount);
            }
            statusText.innerText = `Search Complete.`;
        } catch (err) {
            console.error(err);
            statusText.innerText = "An error occurred during processing.";
        } finally {
            searchBtn.disabled = false;
        }
    }

    async function scanPdf(file, fileName, fileId, kw1, kw2, config, matchCount) {
        const arrayBuffer = await file.arrayBuffer();
        const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
        
        try {
            const pdf = await loadingTask.promise;

            // 1. Extract all page texts sequentially
            const pageTexts = [];
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                pageTexts.push(textContent.items.map(item => item.str).join(' '));
                page.cleanup();
            }

            // 2. Scan each page while incorporating surrounding text boundaries from neighboring pages
            for (let i = 0; i < pageTexts.length; i++) {
                const currentPageText = pageTexts[i];
                const pageNum = i + 1;

                // Grab previous page tail text if needed for Chars Before
                const prevText = i > 0 ? pageTexts[i - 1] : '';
                // Grab next page head text if needed for Chars After
                const nextText = i < pageTexts.length - 1 ? pageTexts[i + 1] : '';

                const regex1 = new RegExp(kw1.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
                let m;

                while ((m = regex1.exec(currentPageText)) !== null) {
                    if (m.index === regex1.lastIndex) regex1.lastIndex++;

                    let snippetBefore = '';
                    let snippetAfter = '';

                    // Calculate Chars Before across page boundaries
                    if (m.index >= config.preSize) {
                        snippetBefore = currentPageText.substring(m.index - config.preSize, m.index);
                    } else {
                        const neededFromPrev = config.preSize - m.index;
                        const prevChunk = prevText.slice(-neededFromPrev);
                        snippetBefore = (prevChunk ? prevChunk + ' [PAGE BREAK] ' : '') + currentPageText.substring(0, m.index);
                    }

                    // Calculate Chars After across page boundaries
                    const matchEnd = m.index + m[0].length;
                    const remainingInPage = currentPageText.length - matchEnd;

                    if (remainingInPage >= config.postSize) {
                        snippetAfter = currentPageText.substring(matchEnd, matchEnd + config.postSize);
                    } else {
                        const neededFromNext = config.postSize - remainingInPage;
                        const nextChunk = nextText.substring(0, neededFromNext);
                        snippetAfter = currentPageText.substring(matchEnd) + (nextChunk ? ' [PAGE BREAK] ' + nextChunk : '');
                    }

                    const snippetMatch = m[0];
                    const fullSnippetText = snippetBefore + snippetMatch + snippetAfter;

                    // Filter using secondary keyword against the combined cross-page snippet context
                    if (kw2) {
                        const filterRegex = new RegExp(kw2.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i');
                        if (!filterRegex.test(fullSnippetText)) continue;
                        
                        snippetBefore = highlightSecondary(snippetBefore, kw2);
                        snippetAfter = highlightSecondary(snippetAfter, kw2);
                    }

                    matchCount++;
                    counterText.innerText = `Matches: ${matchCount}`;
                    addResultUI(fileName, fileId, pageNum, snippetBefore, snippetMatch, snippetAfter);
                }
            }
            
            await pdf.cleanup();
            await pdf.destroy();
        } catch (e) {
            console.error("Error reading PDF content:", e);
        } finally {
            loadingTask.destroy();
        }
        
        return matchCount;
    }

    function openPdfLink(fileId, pageNum) {
        const file = fileMap.get(fileId);
        if (!file) return alert("File source missing.");
        
        const win = window.open('about:blank', '_blank');
        if (!win) {
            return alert("Popup blocker is blocking the window. Please allow popups.");
        }
        
        file.arrayBuffer().then(buffer => {
            const fileBlob = new Blob([buffer], { type: 'application/pdf' });
            const fileURL = URL.createObjectURL(fileBlob);
            
            win.location.href = `${fileURL}#page=${pageNum}`;
            
            setTimeout(() => {
                URL.revokeObjectURL(fileURL);
            }, 5000);
        }).catch(err => {
            console.error(err);
            win.close();
        });
    }

    function getSearchConfig() {
        return {
            preSize: parseInt(document.getElementById('pre').value) || 0,
            postSize: parseInt(document.getElementById('post').value) || 0,
            fileFilters: document.getElementById('fileFilter').value
                .split(';')
                .map(line => line.trim().toLowerCase())
                .filter(line => line.length > 0)
        };
    }

    function isFileAllowed(fileName, filters) {
        if (filters.length === 0) return true;
        const lowercaseName = fileName.toLowerCase();
        return filters.some(prefix => lowercaseName.startsWith(prefix));
    }

    function highlightSecondary(text, kw) {
        const r = new RegExp(kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
        return text.replace(r, (m) => `<span class="hl-secondary">${m}</span>`);
    }

    function addResultUI(file, fileId, page, before, match, after) {
        const div = document.createElement('div');
        div.className = 'result-card';
        div.innerHTML = `
            <div class="result-header">
                <span>📄 <a href="javascript:void(0)" onclick="openPdfLink('${fileId}', ${page})" class="file-link">${file}</a></span>
                <span style="color:#64748b">PAGE ${page}</span>
            </div>
            <div class="snippet">...${before}<span class="hl-primary">${match}</span>${after}...</div>
        `;
        resultsDiv.append(div);
    }

    document.getElementById('clearBtn').onclick = () => {
        resultsDiv.innerHTML = '';
        counterText.innerText = 'Matches: 0';
        statusText.innerText = 'Cleared.';
        fileMap.clear();
    };
</script>

</body>
</html>
